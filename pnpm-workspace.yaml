packages:
  - "packages/*"
  - "apps/*"
# Both are part of the @web/test-runner toolchain and need their postinstall:
# esbuild links a platform-native binary and simply cannot run without it.
allowBuilds:
  esbuild: true
  rs-module-lexer: true
  # From wrangler, which deploys the docs to Cloudflare. workerd is the local
  # Workers runtime that `wrangler dev` runs the site in; sharp is only used by
  # an image-processing feature the docs do not use.
  sharp: false
  workerd: true
