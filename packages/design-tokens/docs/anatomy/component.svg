      <text class="label" x="532.3" y="146">Property</text>
      <text class="note" x="532.3" y="163">3 color · 23 CSS</text>
    </g>
    <g class="seg seg-5">
      <rect x="612.9" y="74" width="145.7" height="46" rx="7"/>
      <text class="mono" x="685.8" y="103">hover</text>
      <text class="label" x="685.8" y="146">State</text>
      <text class="note" x="685.8" y="163">optional · 9 states</text>
    </g>
</svg>
