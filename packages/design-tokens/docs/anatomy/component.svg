      <text class="mono" x="192.1" y="103">component</text>
      <text class="label" x="192.1" y="146">Tier identifier</text>
      <text class="note" x="192.1" y="163">literal</text>
    </g>
    <g class="seg seg-2">
      <rect x="252.4" y="74" width="114.2" height="46" rx="7"/>
