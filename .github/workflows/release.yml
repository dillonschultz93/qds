name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC), which avoids a long-lived token.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs history to work out what has changed since the last
          # release.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Two modes, both handled by this one action:
      #
      #   - changesets pending → opens/updates a "Version Packages" PR that applies
      #     the version bumps and changelog entries
      #   - that PR merged     → publishes @quieto/design-tokens and @quieto/ui
      #
      # `docs` is listed under `ignore` in .changeset/config.json, so the private
      # site is never versioned or published.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
